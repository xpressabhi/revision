name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Pin the tinyjs CLI (matches minTinyjsVersion). The unpinned installer
  # resolves "latest" through the unauthenticated GitHub API, which is
  # rate-limited on shared runner IPs.
  TINYJS_VERSION: v0.42.3

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install tinyjs CLI
        run: curl -fsSL https://tinyjs.app/install | sh

      - name: Install frontend dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # Each build re-runs the frontend build (wiping dist/), so stash every
      # dmg in artifacts/ as it is produced.
      - name: Build Apple Silicon dmg
        run: |
          "$HOME/.tinyjs/tinyjs" build --arch arm64 --dmg
          mkdir -p artifacts
          cp dist/*.dmg artifacts/

      - name: Build Intel dmg
        run: |
          "$HOME/.tinyjs/tinyjs" build --arch x86_64 --dmg
          cp dist/*.dmg artifacts/

      - name: Upload dmgs
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmgs
          path: artifacts/*.dmg
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install tinyjs CLI
        shell: pwsh
        run: irm https://tinyjs.app/install.ps1 | iex

      - name: Install frontend dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Package (portable zip)
        shell: pwsh
        run: |
          $env:Path += ";$env:LOCALAPPDATA\tinyjs"
          tinyjs publish

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/publish/*.zip
          if-no-files-found: warn

  linux:
    # glibc floor rule: never build on a distro newer than the support floor
    # (22.04 = glibc 2.35). The guard step below verifies the tarball.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install WebKitGTK runtime
        run: |
          # Fresh runners sometimes have apt-daily/unattended-upgrades holding
          # the dpkg lock; without DPkg::Lock::Timeout apt waits on it forever
          # (a 10-minute stall seen in practice). Bound the lock wait and the
          # network, and keep recommends out of the install.
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            -o DPkg::Lock::Timeout=180 libwebkit2gtk-4.1-0

      - name: Install tinyjs CLI
        run: curl -fsSL https://tinyjs.app/install | sh

      - name: Install frontend dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Package (x86_64 tarball)
        run: '"$HOME/.tinyjs/tinyjs" publish'

      - name: Verify glibc floor (2.35)
        run: |
          latest=$(objdump -T dist/revision | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "highest glibc symbol: $latest"
          if [ "$(printf '%s\n' "$latest" GLIBC_2.35 | sort -V | tail -1)" != "GLIBC_2.35" ]; then
            echo "::error::tarball requires $latest — build on ubuntu 22.04 (glibc 2.35)"
            exit 1
          fi

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: dist/publish/*.tar.gz
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: assets

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release-notes.md <<'EOF'
          - macOS: download the `-macos-arm64.dmg` (Apple Silicon) or `-macos-x86_64.dmg` (Intel), open it and drag Revision to Applications. First launch: right-click → Open if Gatekeeper complains (the app is ad-hoc signed).
          - Windows: unzip and run `revision.exe` (needs the WebView2 runtime — preinstalled on Windows 11).
          - Linux: untar and run `./revision` (needs glibc 2.35+ and `libwebkit2gtk-4.1-0`).
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --title "Revision ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            assets/*
