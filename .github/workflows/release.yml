name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - platform: macos-latest
            os: macos-arm64
            args: --target aarch64-apple-darwin
          # macOS Intel (cross-compile on same runner)
          - platform: macos-latest
            os: macos-x64
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            os: windows
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (nightly for macOS Xcode 27, stable for Windows)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.platform == 'macos-latest' && 'nightly' || 'stable' }}
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # Tauri Action builds the app and (on tags) creates a GitHub Release with assets.
      # - On tag push (v*): creates/updates a Release and uploads .dmg/.exe/.msi
      # - On branch push / manual dispatch: just builds and uploads artifacts for inspection
      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Only create a GitHub Release when a version tag is pushed.
          # __VERSION__ is replaced by the version in tauri.conf.json / Cargo.toml / package.json
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && 'v__VERSION__' || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && 'Revision v__VERSION__' || '' }}
          releaseBody: "See the assets to download this version and install.\n\n- macOS: download the .dmg, open it and drag Revision to Applications\n- Windows: download the .exe (NSIS) or .msi and run the installer"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      # Fallback artifact upload so every build (even non-tag) is downloadable from Actions tab
      - name: Upload bundle as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/macos/*.app
            src-tauri/target/*/release/bundle/nsis/*.exe
            src-tauri/target/*/release/bundle/msi/*.msi
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.exe
            src-tauri/target/**/bundle/**/*.msi
          if-no-files-found: warn
          retention-days: 14
