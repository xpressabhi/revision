name: RevisionWidget
options:
  bundleIdPrefix: com.revision.app
  xcodeVersion: "15.0"
  deploymentTarget:
    macOS: "14.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    SKIP_INSTALL: false

targets:
  RevisionWidget:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    bundleId: com.revision.app.RevisionWidget
    info:
      path: RevisionWidget/Info.plist
      properties: {}
    entitlements:
      path: RevisionWidget/RevisionWidget.entitlements
    sources:
      - RevisionWidget
    settings:
      base:
        INFOPLIST_FILE: RevisionWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: RevisionWidget/RevisionWidget.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
        SKIP_INSTALL: YES
